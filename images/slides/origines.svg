<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500"><style>
.steam{animation:s 3s ease-in-out infinite}@keyframes s{50%{transform:translateY(-8px);opacity:.25}}
.rays{transform-origin:250px 250px;animation:r 8s ease-in-out infinite}@keyframes r{50%{transform:rotate(6deg) scale(1.03)}}
.orbit{transform-origin:250px 250px;animation:o 18s linear infinite}@keyframes o{to{transform:rotate(360deg)}}
.float{animation:f 4s ease-in-out infinite}@keyframes f{50%{transform:translateY(-10px)}}
.wheel{transform-box:fill-box;transform-origin:center;animation:o 1s linear infinite}
.speed{animation:sp 1s linear infinite}@keyframes sp{from{transform:translateX(30px);opacity:0}50%{opacity:1}to{transform:translateX(-40px);opacity:0}}
.pin{transform-box:fill-box;transform-origin:bottom;animation:pn 2.4s ease-in-out infinite}@keyframes pn{50%{transform:translateY(-6px)}}
@media (prefers-reduced-motion:reduce){.steam,.rays,.orbit,.float,.wheel,.speed,.pin{animation:none}}
